<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#fff}
.mb{display:inline-flex;align-items:center;gap:8px;height:22px;padding:0 8px;border:0;border-radius:6px;background:none;color:inherit;font:inherit;cursor:default}
.mb:hover{background:rgba(255,255,255,.22)}
.mb svg{display:block}
.dock-item{position:relative;display:flex;flex-direction:column;align-items:center;padding:0;border:0;background:none;cursor:default;transition:transform .18s cubic-bezier(.2,.8,.3,1.2);transform-origin:50% 100%}
.dock-item:hover,.dock-item:focus-visible{transform:translateY(-8px) scale(1.3)}
.dock-item:focus-visible{outline:none}
.dock-item:focus-visible .tile{box-shadow:0 0 0 3px rgba(255,255,255,.85)}
.tile{display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.3),inset 0 0 0 .5px rgba(255,255,255,.35)}
.tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) scale(.77);transform-origin:50% 100%;padding:3px 10px;border-radius:8px;background:rgba(30,30,34,.8);color:#fff;font-size:13px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .1s}
.dock-item:hover .tip,.dock-item:focus-visible .tip{opacity:1}
.dot{position:absolute;bottom:-7px;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.85)}
.titlebar{user-select:none;-webkit-user-select:none}
.lights{display:flex;gap:8px}
.light{display:flex;align-items:center;justify-content:center;width:12px;height:12px;padding:0;border-radius:50%;border:.5px solid rgba(0,0,0,.25);cursor:default}
.light svg{opacity:0}
.lights:hover .light svg,.light:focus-visible svg{opacity:1}
.seg{display:flex;align-items:center;justify-content:center;width:44px;height:28px;border:0;border-radius:6px;background:none;color:#fff;cursor:default}
.seg:hover{background:rgba(255,255,255,.08)}
.shutter{cursor:default;transition:transform .1s}
.shutter:active{transform:scale(.94)}
.thumb{cursor:default;transition:transform .12s}
.thumb:hover{transform:scale(1.03)}
.flash{animation:flash .35s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.gate{display:none}
@media (max-width: 899px){.desktop{display:none}.gate{display:flex}}
</style>
</helmet>
<div style="width: 100%; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, 'Helvetica Neue', sans-serif; color: #fff">

<div class="desktop" style="position: relative; width: 100%; height: 100vh; min-height: 600px; overflow: hidden; background: #000">
<div onPointerDown="{{focusDesktop}}" style="position: absolute; inset: 0; background: {{wallBg}}"></div>

<header style="position: absolute; top: 0; left: 0; right: 0; z-index: 20; height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; box-sizing: border-box; font-size: 13px; font-weight: 500; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3)">
<nav aria-label="Menu bar" style="display: flex; align-items: center; gap: 2px">
<button class="mb" aria-label="System menu" style="padding: 0 12px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#fff"></circle></svg></button>
<sc-for list="{{menus}}" as="m" hint-placeholder-count="7">
<button class="mb" style="font-weight: {{m.weight}}">{{m.label}}</button>
</sc-for>
</nav>
<div style="display: flex; align-items: center; gap: 2px">
<button class="mb" aria-label="Battery"><svg aria-hidden="true" width="24" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><rect x="2" y="7" width="18" height="10" rx="3"></rect><rect x="4" y="9" width="12" height="6" rx="1.5" fill="#fff" stroke="none"></rect><path d="M22 10.5v3" stroke-linecap="round"></path></svg></button>
<button class="mb" aria-label="Wi-Fi"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M2 9a15 15 0 0 1 20 0"></path><path d="M5.5 12.5a10 10 0 0 1 13 0"></path><path d="M9 16a5 5 0 0 1 6 0"></path><circle cx="12" cy="19.5" r="1.2" fill="#fff" stroke="none"></circle></svg></button>
<button class="mb" aria-label="Search"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path></svg></button>
<button class="mb" aria-label="Control Center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="2.5" y="4" width="19" height="7" rx="3.5"></rect><circle cx="7" cy="7.5" r="2" fill="#fff" stroke="none"></circle><rect x="2.5" y="13" width="19" height="7" rx="3.5"></rect><circle cx="17" cy="16.5" r="2" fill="#fff" stroke="none"></circle></svg></button>
<button class="mb"><span>{{date}}</span><span>{{time}}</span></button>
</div>
</header>

<sc-if value="{{wpOpen}}" hint-placeholder-val="{{ false }}">
<section aria-label="Wallpaper" onPointerDown="{{wpFocus}}" style="position: absolute; width: 600px; display: flex; flex-direction: column; overflow: hidden; border-radius: 18px; background: rgba(246, 246, 248, 0.94); backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8); color: #1d1d1f; box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.2), 0 24px 70px rgba(0, 0, 0, 0.45); {{wpBox}}">
<div class="titlebar" onPointerDown="{{wpDrag}}" style="position: relative; height: 44px; flex: none; display: flex; align-items: center; padding: 0 16px">
<div class="lights">
<button class="light" onClick="{{wpClose}}" aria-label="Close" style="background: #ff5f57"><svg aria-hidden="true" width="6" height="6" viewBox="0 0 10 10" stroke="#4d0000" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l6 6M8 2l-6 6"></path></svg></button>
<button class="light" onClick="{{wpClose}}" aria-label="Minimize" style="background: #febc2e"><svg aria-hidden="true" width="6" height="6" viewBox="0 0 10 10" stroke="#5a3a00" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 5h7"></path></svg></button>
<button class="light" aria-label="Zoom" disabled style="background: #d4d4d8"></button>
</div>
<h2 style="position: absolute; left: 0; right: 0; margin: 0; text-align: center; font-size: 13px; font-weight: 600; pointer-events: none">Wallpaper</h2>
</div>
<div style="display: flex; flex-direction: column; gap: 20px; padding: 4px 24px 24px">
<div style="display: flex; align-items: center; gap: 20px; padding: 16px; border-radius: 12px; background: #ffffff; box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.1)">
<div style="flex: none; width: 200px; height: 125px; border-radius: 8px; background: {{wallBg}}; box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.15)"></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 15px; font-weight: 600">{{wallName}}</p>
<p style="margin: 0; font-size: 12px; color: #6e6e73">Fill Screen</p>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 13px; font-weight: 600; color: #3a3a3c">Wallpapers</h3>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{walls}}" as="w" hint-placeholder-count="6">
<button class="thumb" onClick="{{w.pick}}" aria-label="{{w.name}}" aria-pressed="{{w.sel}}" style="display: flex; flex-direction: column; gap: 6px; padding: 0; border: 0; background: none; color: #1d1d1f; font: inherit; text-align: left">
<span style="display: block; width: 100%; aspect-ratio: 16 / 10; border-radius: 8px; background: {{w.bg}}; box-shadow: {{w.ring}}"></span>
<span style="font-size: 12px; color: #3a3a3c">{{w.name}}</span>
</button>
</sc-for>
</div>
</div>
</div>
</section>
</sc-if>

<sc-if value="{{pbOpen}}" hint-placeholder-val="{{ false }}">
<section aria-label="Photo Booth" onPointerDown="{{pbFocus}}" style="position: absolute; display: flex; flex-direction: column; overflow: hidden; background: #1c1c1e; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1), 0 24px 70px rgba(0, 0, 0, 0.55); {{pbBox}}">
<div class="titlebar" onPointerDown="{{pbDrag}}" style="position: relative; height: 38px; flex: none; display: flex; align-items: center; padding: 0 14px; background: #2a2a2d; border-bottom: 1px solid #000">
<div class="lights">
<button class="light" onClick="{{pbClose}}" aria-label="Close" style="background: #ff5f57"><svg aria-hidden="true" width="6" height="6" viewBox="0 0 10 10" stroke="#4d0000" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l6 6M8 2l-6 6"></path></svg></button>
<button class="light" onClick="{{pbClose}}" aria-label="Minimize" style="background: #febc2e"><svg aria-hidden="true" width="6" height="6" viewBox="0 0 10 10" stroke="#5a3a00" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 5h7"></path></svg></button>
<button class="light" onClick="{{pbToggleFull}}" aria-label="Toggle full screen" style="background: #28c840"><svg aria-hidden="true" width="6" height="6" viewBox="0 0 10 10" fill="#0a4d12"><path d="M2 2h4.5L2 6.5zM8 8H3.5L8 3.5z"></path></svg></button>
</div>
<h2 style="position: absolute; left: 0; right: 0; margin: 0; text-align: center; font-size: 13px; font-weight: 600; color: #e5e5ea; pointer-events: none">Photo Booth</h2>
</div>

<div style="position: relative; flex: 1 1 auto; min-height: 0; display: flex; align-items: flex-end; justify-content: center; background: radial-gradient(ellipse at 50% 40%, #3a3a40 0%, #141416 70%)">
<svg aria-hidden="true" viewBox="0 0 200 160" style="height: 78%; display: block"><circle cx="100" cy="58" r="34" fill="#2a2a2f"></circle><path d="M30 160c0-40 30-62 70-62s70 22 70 62z" fill="#2a2a2f"></path></svg>
<p style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); margin: 0; padding: 6px 12px; border-radius: 8px; background: rgba(0, 0, 0, 0.55); font-size: 13px; color: #d1d1d6">[ Live webcam feed, mirrored ]</p>
</div>

<div style="flex: none; height: 76px; display: flex; align-items: center; gap: 8px; padding: 0 14px; overflow-x: auto; background: #161618; border-top: 1px solid #2c2c2e">
<sc-for list="{{shots}}" as="s" hint-placeholder-count="0">
<button aria-label="Photo {{s.n}}" style="flex: none; width: 96px; height: 54px; padding: 0; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; border-radius: 4px; border: 1px solid #3a3a3c; background: radial-gradient(ellipse at 50% 40%, #4a4a52, #1c1c1f)"><svg aria-hidden="true" viewBox="0 0 200 160" style="height: 80%; display: block"><circle cx="100" cy="58" r="34" fill="#2e2e33"></circle><path d="M30 160c0-40 30-62 70-62s70 22 70 62z" fill="#2e2e33"></path></svg></button>
</sc-for>
</div>

<div style="flex: none; height: 64px; display: flex; align-items: center; padding: 0 16px; background: linear-gradient(180deg, #2b2b2e, #1e1e20); border-top: 1px solid #3a3a3c">
<div style="flex: 1 1 0; display: flex">
<div style="display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: #3a3a3c">
<button class="seg" aria-label="Take four quick pictures" aria-pressed="false"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="7" rx="1"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1"></rect></svg></button>
<button class="seg" aria-label="Take a still picture" aria-pressed="true" style="background: #636366"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3.5" y="5.5" width="17" height="13" rx="1.5"></rect></svg></button>
<button class="seg" aria-label="Record a movie clip" aria-pressed="false"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#fff"><rect x="3" y="7" width="12" height="10" rx="2"></rect><path d="M15.5 11l5.5-3.5v9L15.5 13z"></path></svg></button>
</div>
</div>
<div style="flex: none; width: 160px; height: 56px; display: flex; align-items: center; justify-content: center">
<sc-if value="{{idle}}" hint-placeholder-val="{{ true }}">
<button class="shutter" onClick="{{shoot}}" aria-label="Take photo" style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 50%; border: 3px solid #e8e8ea; background: #e5332a; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"></path><circle cx="12" cy="13.5" r="3.5"></circle></svg></button>
</sc-if>
<sc-if value="{{counting}}" hint-placeholder-val="{{ false }}">
<div role="status" aria-live="polite" style="display: flex; gap: 22px; font-size: 28px; font-weight: 600">
<sc-for list="{{digits}}" as="d" hint-placeholder-count="3">
<sc-if value="{{d.on}}" hint-placeholder-val="{{ false }}"><span style="color: #ffffff">{{d.n}}</span></sc-if>
<sc-if value="{{d.off}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="color: #5a5a5e">{{d.n}}</span></sc-if>
</sc-for>
</div>
</sc-if>
</div>
<div style="flex: 1 1 0; display: flex; justify-content: flex-end">
<button style="height: 28px; padding: 0 14px; border: 0; border-radius: 7px; background: #3a3a3c; color: #fff; font: inherit; font-size: 13px; font-weight: 500; cursor: default">Effects</button>
</div>
</div>

<sc-if value="{{flash}}" hint-placeholder-val="{{ false }}">
<div class="flash" aria-hidden="true" style="position: absolute; inset: 0; background: #fff; pointer-events: none"></div>
</sc-if>
</section>
</sc-if>

<div style="position: absolute; left: 0; right: 0; bottom: 6px; z-index: 15; display: flex; justify-content: center; pointer-events: none">
<nav aria-label="Dock" style="pointer-events: auto; display: flex; align-items: flex-end; gap: 6px; padding: 7px 9px 11px; border-radius: 26px; background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.32); backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 10px 30px rgba(0, 0, 0, 0.25)">

<button class="dock-item" aria-label="Finder"><span class="tile" style="background: linear-gradient(180deg, #63c0ff, #1f74ff)"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.2l1.8 2h9A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" fill="#fff"></path></svg></span><span class="tip">Finder</span><span class="dot"></span></button>

<button class="dock-item" aria-label="Launchpad"><span class="tile" style="background: linear-gradient(180deg, #5a5a60, #2c2c30)"><svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="4" height="4" rx="1.2" fill="#ff6b6b"></rect><rect x="10" y="4.5" width="4" height="4" rx="1.2" fill="#ffd43b"></rect><rect x="15.5" y="4.5" width="4" height="4" rx="1.2" fill="#69db7c"></rect><rect x="4.5" y="10" width="4" height="4" rx="1.2" fill="#4dabf7"></rect><rect x="10" y="10" width="4" height="4" rx="1.2" fill="#da77f2"></rect><rect x="15.5" y="10" width="4" height="4" rx="1.2" fill="#ff922b"></rect><rect x="4.5" y="15.5" width="4" height="4" rx="1.2" fill="#38d9a9"></rect><rect x="10" y="15.5" width="4" height="4" rx="1.2" fill="#f783ac"></rect><rect x="15.5" y="15.5" width="4" height="4" rx="1.2" fill="#e9ecef"></rect></svg></span><span class="tip">Launchpad</span></button>

<button class="dock-item" aria-label="Browser"><span class="tile" style="background: linear-gradient(180deg, #ffffff, #e3e7ee)"><svg aria-hidden="true" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#1a7cff" stroke-width="1.5"><circle cx="12" cy="12" r="8.5"></circle><ellipse cx="12" cy="12" rx="3.8" ry="8.5"></ellipse><path d="M3.5 12h17M5 7.5h14M5 16.5h14"></path></svg></span><span class="tip">Browser</span></button>

<button class="dock-item" aria-label="Messages"><span class="tile" style="background: linear-gradient(180deg, #6af27a, #1fc23a)"><svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24"><path d="M12 4c-4.97 0-9 3.360-9 7.5 0 2.3 1.25 4.36 3.2 5.74L5.5 20l3.6-1.8c.92.2 1.89.3 2.9.3 4.97 0 9-3.36 9-7.5S16.97 4 12 4z" fill="#fff"></path></svg></span><span class="tip">Messages</span></button>

<button class="dock-item" aria-label="Mail"><span class="tile" style="background: linear-gradient(180deg, #4fb2ff, #1569ff)"><svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M3.5 7l8.5 6 8.5-6"></path></svg></span><span class="tip">Mail</span></button>

<button class="dock-item" aria-label="Maps"><span class="tile" style="background: linear-gradient(135deg, #d7f0c2, #f6ecd0)"><svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#3a7d44" stroke-width="1.5" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"></path><path d="M9 4v14M15 6v14"></path><circle cx="15" cy="9.5" r="2.2" fill="#ff3b30" stroke="none"></circle></svg></span><span class="tip">Maps</span></button>

<button class="dock-item" aria-label="Photos"><span class="tile" style="background: #ffffff"><svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24"><circle cx="16.5" cy="12" r="4.2" fill="#ff9f0a" opacity="0.8"></circle><circle cx="14.25" cy="15.9" r="4.2" fill="#ffd60a" opacity="0.8"></circle><circle cx="9.75" cy="15.9" r="4.2" fill="#34c759" opacity="0.8"></circle><circle cx="7.5" cy="12" r="4.2" fill="#0a84ff" opacity="0.8"></circle><circle cx="9.75" cy="8.1" r="4.2" fill="#bf5af2" opacity="0.8"></circle><circle cx="14.25" cy="8.1" r="4.2" fill="#ff375f" opacity="0.8"></circle></svg></span><span class="tip">Photos</span></button>

<button class="dock-item" aria-label="FaceTime"><span class="tile" style="background: linear-gradient(180deg, #6af27a, #1fc23a)"><svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="#fff"><rect x="3" y="7" width="12" height="10" rx="2"></rect><path d="M15.5 11l5.5-3.5v9L15.5 13z"></path></svg></span><span class="tip">FaceTime</span></button>

<button class="dock-item" aria-label="Calendar"><span class="tile" style="background: #ffffff; flex-direction: column; gap: 1px"><span style="font-size: 10px; font-weight: 600; letter-spacing: 0.5px; color: #ff3b30">{{weekday}}</span><span style="font-size: 30px; font-weight: 300; line-height: 1; color: #1c1c1e">{{day}}</span></span><span class="tip">Calendar</span></button>

<button class="dock-item" aria-label="Notes"><span class="tile" style="background: linear-gradient(180deg, #ffd43b 0, #ffd43b 26%, #fffef7 26%)"><svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#d6d3c7" stroke-width="1"><path d="M4 12h16M4 15.5h16M4 19h16"></path></svg></span><span class="tip">Notes</span></button>

<button class="dock-item" aria-label="Music"><span class="tile" style="background: linear-gradient(180deg, #ff6b81, #fa2d48)"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M9 18V6l11-2v12"></path><circle cx="6.5" cy="18" r="2.5" fill="#fff" stroke="none"></circle><circle cx="17.5" cy="16" r="2.5" fill="#fff" stroke="none"></circle></svg></span><span class="tip">Music</span></button>

<button class="dock-item" onClick="{{wpOpenIt}}" aria-label="System Settings"><span class="tile" style="background: linear-gradient(180deg, #b9bcc4, #7d828c)"><svg aria-hidden="true" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5.5"></circle><circle cx="12" cy="12" r="2" fill="#fff" stroke="none"></circle><path d="M12 5V2.5M19 12h2.5M12 19v2.5M5 12H2.5M16.95 7.05l1.77-1.77M16.95 16.95l1.77 1.77M7.05 16.95l-1.77 1.77M7.05 7.05L5.28 5.28" stroke-width="2.4"></path></svg></span><span class="tip">System Settings</span><sc-if value="{{wpOpen}}" hint-placeholder-val="{{ false }}"><span class="dot"></span></sc-if></button>

<span aria-hidden="true" style="align-self: center; width: 1px; height: 48px; margin: 0 4px; background: rgba(255, 255, 255, 0.35)"></span>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.walls = [
{ name: 'Glass Blue', bg: 'radial-gradient(ellipse 70% 55% at 25% 105%, #59d0ff 0%, transparent 60%), radial-gradient(ellipse 55% 45% at 85% 15%, #8f7dff 0%, transparent 60%), radial-gradient(ellipse 90% 70% at 55% 60%, #1f6fe0 0%, transparent 70%), linear-gradient(160deg, #051646 0%, #0c3a98 60%, #2f8fff 100%)' },
{ name: 'Ember', bg: 'radial-gradient(ellipse 65% 55% at 22% 78%, #ff8a3d 0%, transparent 62%), radial-gradient(ellipse 50% 42% at 68% 42%, #ff3d6e 0%, transparent 65%), radial-gradient(ellipse 75% 60% at 88% 90%, #3a5bff 0%, transparent 60%), linear-gradient(180deg, #0a0f3a 0%, #2a0f4a 100%)' },
{ name: 'Dusk Hills', bg: 'radial-gradient(ellipse 45% 25% at 78% 22%, rgba(47, 123, 255, 0.55) 0%, transparent 70%), linear-gradient(180deg, #0a1440 0%, #2b145e 42%, #5b3cff 58%, #ff4f7a 76%, #ff9a3c 100%)' },
{ name: 'Violet', bg: 'radial-gradient(ellipse 65% 50% at 20% 30%, #c86bff 0%, transparent 60%), radial-gradient(ellipse 60% 60% at 80% 72%, #5b2dff 0%, transparent 60%), linear-gradient(135deg, #1a0838 0%, #3b0f6e 100%)' },
{ name: 'Lagoon', bg: 'radial-gradient(ellipse 70% 50% at 30% 82%, #3ddc97 0%, transparent 60%), radial-gradient(ellipse 60% 50% at 76% 24%, #1fa2ff 0%, transparent 60%), linear-gradient(160deg, #03282e 0%, #0b5d4f 100%)' },
{ name: 'Graphite', bg: 'radial-gradient(ellipse 80% 60% at 50% 0%, #5a5e68 0%, transparent 70%), linear-gradient(180deg, #34373e 0%, #121316 100%)' }
];
this.state = {
now: new Date(), wall: 0, front: null,
pbOpen: false, pbFull: false, pbX: 310, pbY: 70,
wpOpen: false, wpX: 420, wpY: 90,
count: 0, flash: false, shots: []
};
}
componentDidMount() {
this.clock = setInterval(() => this.setState({ now: new Date() }), 10000);
}
componentWillUnmount() {
clearInterval(this.clock);
clearTimeout(this.timer);
}
drag(id, e) {
if (id === 'pb' && this.state.pbFull) return;
const sx = e.clientX, sy = e.clientY, ox = this.state[id + 'X'], oy = this.state[id + 'Y'];
const move = (ev) => this.setState({ [id + 'X']: ox + ev.clientX - sx, [id + 'Y']: Math.max(28, oy + ev.clientY - sy) });
const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
window.addEventListener('pointermove', move);
window.addEventListener('pointerup', up);
}
tick(n) {
if (n > 0) {
this.setState({ count: n });
this.timer = setTimeout(() => this.tick(n - 1), 1000);
return;
}
const shots = this.state.shots.concat(this.state.shots.length + 1).slice(-12);
this.setState({ count: 0, flash: true, shots });
this.timer = setTimeout(() => this.setState({ flash: false }), 350);
}
renderVals() {
const s = this.state, d = s.now, c = s.count, wall = this.walls[s.wall];
const menus = s.front === 'pb' ? ['Photo Booth', 'File', 'Edit', 'View', 'Camera', 'Window', 'Help']
: s.front === 'wp' ? ['System Settings', 'Edit', 'View', 'Window', 'Help']
: ['Finder', 'File', 'Edit', 'View', 'Go', 'Window', 'Help'];
return {
date: d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).replace(',', ''),
time: d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }),
weekday: d.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase(),
day: d.getDate(),
menus: menus.map((label, i) => ({ label, weight: i === 0 ? 700 : 500 })),
focusDesktop: () => this.setState({ front: null }),
wallBg: wall.bg,
wallName: wall.name,
walls: this.walls.map((w, i) => ({
name: w.name, bg: w.bg, sel: i === s.wall,
ring: i === s.wall ? '0 0 0 3px #0a84ff' : '0 0 0 0.5px rgba(0, 0, 0, 0.18)',
pick: () => this.setState({ wall: i })
})),
wpOpen: s.wpOpen,
wpBox: 'left: ' + s.wpX + 'px; top: ' + s.wpY + 'px; z-index: ' + (s.front === 'wp' ? 12 : 11),
wpOpenIt: () => this.setState({ wpOpen: true, front: 'wp' }),
wpClose: () => this.setState({ wpOpen: false, front: null }),
wpFocus: () => this.setState({ front: 'wp' }),
wpDrag: (e) => this.drag('wp', e),
pbOpen: s.pbOpen,
pbBox: s.pbFull
? 'left: 0; top: 0; width: 100%; height: 100%; border-radius: 0; z-index: 30'
: 'left: ' + s.pbX + 'px; top: ' + s.pbY + 'px; width: 820px; height: 640px; border-radius: 16px; z-index: ' + (s.front === 'pb' ? 12 : 11),
pbOpenIt: () => this.setState({ pbOpen: true, front: 'pb' }),
pbClose: () => this.setState({ pbOpen: false, pbFull: false, front: null }),
pbFocus: () => this.setState({ front: 'pb' }),
pbDrag: (e) => this.drag('pb', e),
pbToggleFull: () => this.setState({ pbFull: !s.pbFull }),
idle: c === 0,
counting: c > 0,
flash: s.flash,
shoot: () => { if (!this.state.count && !this.state.flash) this.tick(3); },
digits: [3, 2, 1].map((n) => ({ n, on: n === c, off: n !== c })),
shots: s.shots.map((n) => ({ n }))
};
}
}
</script>
